name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (used in APK filename)'
        required: false
        default: 'v1.0.0-test'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (Chaquopy build python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK/NDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          sdkmanager() { "$SDKMANAGER" "$@"; }
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          # platform 37 + NDK 27.2 as required by version catalog
          sdkmanager "platforms;android-37" "ndk;27.2.12479018"

      - name: chmod gradlew
        run: chmod +x gradlew

      # Uses the .key/app-release.jks already in repo + gradle.properties passwords,
      # so release signing works without any secrets.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename & verify APK
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/AVBox_release.apk
          test -f "$SRC" || { echo "::error::APK not found: $SRC"; ls -R app/build/outputs/apk 2>/dev/null; exit 1; }
          VERSION='${{ github.event.inputs.version }}'
          OUT="AVBox_${VERSION}_arm64-v8a.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVBox-apk
          path: ${{ steps.apk.outputs.path }}
