name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (used in APK filename)'
        required: false
        default: 'v1.0.0-test'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (Chaquopy build python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK Platform 37 + NDK 27.2 (direct zip, no sdkmanager)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TMP="$(mktemp -d)"
          
          # Platform 37.0: zip contains platforms/android-37 directory
          echo "--- Downloading platform-37.0 ---"
          curl -fsSL "https://dl.google.com/android/repository/platform-37.0_r02.zip" \
            -o "$TMP/platform.zip"
          echo "--- Extracting platform ---"
          unzip -q "$TMP/platform.zip" -d "$TMP/"
          cp -r "$TMP/android-37.0" "$SDK_ROOT/platforms/android-37"
          echo "Installed: $SDK_ROOT/platforms/android-37"
          
          # NDK 27.2 (r27c): zip contains android-ndk-*/ directories
          echo "--- Downloading NDK 27.2 (634MB) ---"
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" \
            -o "$TMP/ndk.zip"
          echo "--- Extracting NDK ---"
          unzip -q "$TMP/ndk.zip" -d "$SDK_ROOT/"
          # AVBox needs NDK at $NDK_HOME; setup the expected symlink/name
          NDK_DEST="$SDK_ROOT/ndk/27.2.12479018"
          if [ -d "$SDK_ROOT/android-ndk-r27c" ]; then
            ln -sfn "$SDK_ROOT/android-ndk-r27c" "$NDK_DEST"
            echo "NDK symlinked: $NDK_DEST -> android-ndk-r27c"
          fi

      - name: chmod gradlew
        run: chmod +x gradlew

      # Uses the .key/app-release.jks already in repo + gradle.properties passwords,
      # so release signing works without any secrets.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename & verify APK
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/AVBox_release.apk
          test -f "$SRC" || { echo "::error::APK not found: $SRC"; ls -R app/build/outputs/apk 2>/dev/null; exit 1; }
          VERSION='${{ github.event.inputs.version }}'
          OUT="AVBox_${VERSION}_arm64-v8a.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVBox-apk
          path: ${{ steps.apk.outputs.path }}
